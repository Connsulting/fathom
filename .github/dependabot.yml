version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # pdfjs-dist 6.5 changes how corrupt and oversized streams fail; a future bump must adapt the ingest tests for those streams.
      - dependency-name: pdfjs-dist
        versions:
          - ">= 6.5"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node stays on the 24 LTS line pinned in package engines, CI and the Dockerfile.
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      docker:
        patterns:
          - "*"
