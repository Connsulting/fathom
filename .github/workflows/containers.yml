name: containers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests build and smoke. They do not log in and do not push.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            FATHOM_BUILD_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          load: true
          push: false
          tags: fathom:ci
          cache-from: type=gha
          provenance: false
          sbom: false
      - name: Smoke /healthz
        run: scripts/docker-healthz.sh fathom:ci

  # Pushes to main smoke the image, then push sha-<short> and main. No version tag.
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/connsulting/fathom
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            FATHOM_BUILD_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          load: true
          push: false
          tags: fathom:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Artifact attestations are not available on this private plan.
          # metadata-action still sets OCI source, revision and version labels.
          provenance: false
          sbom: false
      - name: Smoke /healthz
        run: scripts/docker-healthz.sh fathom:ci
      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(printf '%s\n' "$TAGS" | sed '/^$/d')
          scripts/push-tested-image.sh fathom:ci "${tags[@]}"
